name: workbuddy-console
services:
  app:
    build:
      context: ../..
      dockerfile: deploy/admin/Dockerfile
    image: local/codebuddy2api:console
    restart: unless-stopped
    command: ["python3", "-m", "admin.server"]
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      ADMIN_KEY: ${ADMIN_KEY:?Set ADMIN_KEY in .env}
      CODEBUDDY2OPENAI_KEY: ${CODEBUDDY2OPENAI_KEY:?Set an initial client API key in .env}
      CODEBUDDY_AUTH_DIR: /data/auth
      MANAGEMENT_DATA_DIR: /data/management
      TZ: Asia/Shanghai
    volumes:
      - ./auth:/data/auth
      - ./management:/data/management
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
